<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tyrell Lewis | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/heroicons@2.0.18/dist/heroicons.js"></script>

  <!-- If we want more themes, we can add them to the Tailwind config like this: -->
  <script>tailwind.config = { daisyui: { themes: ["light", "dark"] } }</script>
</head>
<body>
 
  <!-- Top Navbar -->
  <div class="navbar bg-primary text-primary-content shadow-md sticky top-0 z-50">
    <!-- Hamburger (mobile) -->
    <div class="flex-none lg:hidden">
      <label for="my-drawer" class="btn btn-square btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </label>
    </div>
    <!-- Brand -->
    <div class="flex-1 justify-center lg:justify-center">
      <a href="index.html" class="btn btn-ghost text-xl font-bold">Tyrell Lewis</a>
    </div>
    <!-- Desktop nav links -->
    <div class="hidden lg:flex flex-none">
      <ul class="menu menu-horizontal px-1">
        <li><a href="index.html" class="font-medium">Home</a></li>

      </ul>
    </div>
    <!-- Dark mode toggle -->
    <div class="flex-none ml-2">
      <label class="swap swap-rotate btn btn-square btn-ghost">
        <input type="checkbox" id="theme-toggle" />
        <!-- Sun icon (shown in dark mode) -->
        <svg class="swap-on size-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>

        <!-- Moon icon (shown in light mode) -->
        <svg class="swap-off size-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>

      </label>
    </div>
  </div>
 
  <!-- Drawer (mobile sidenav) -->
  <div class="drawer">
    <input id="my-drawer" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content"></div>
    <div class="drawer-side z-50">
      <label for="my-drawer" class="drawer-overlay"></label>
      <ul class="menu p-4 w-64 min-h-full bg-base-200 text-base-content">
        <li class="menu-title text-lg font-bold pb-2">Tyrell Lewis</li>
        <li><a href="index.html">Home</a></li>
        <li><a href="studentConductTracker.html">Student Conduct Tracker</a></li>
        <li><a href="predictAthlete.html">Predict Athlete Position</a></li>
        <li><a href="webStore.html">E-Commerce Platform</a></li>
        <li><a href="examPlatform.html">Examination Platform</a></li>
        <li><a href="examPlatformDashboard.html">Examination Platform Dashboard</a></li>

      </ul>
    </div>
  </div>
 
  <!-- Page Content -->
  <main class="container mx-auto px-4 py-10">
    <h1 class="text-4xl font-bold mb-4">E-Commerce Platform</h1>

  </main>
 
  <!-- Theme toggle script -->
  <script>
    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
 
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      html.setAttribute('data-theme', 'dark');
      toggle.checked = true;
    }
 
    toggle.addEventListener('change', () => {
      if (toggle.checked) {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
 
</body>
</html>
